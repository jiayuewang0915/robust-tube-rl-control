[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-rl-tank"
version = "0.1.0"
description = "Two-agent robust DDPG controller for uncertain spherical tank level control."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
    "pandas>=2.0",
    "torch>=2.0",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["robust_rl_tank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
